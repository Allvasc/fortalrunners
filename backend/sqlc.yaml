version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "db/query"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/platform/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "geometry"
            go_type: "string"
