# Lint enxuto — pega o que importa sem afogar em nitpick de estilo.
run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gosimple
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  # misspell fora: o código é comentado em português e ele só entende inglês.

linters-settings:
  errcheck:
    # rollback de transação em defer e drain de conexão: falha aqui não muda nada.
    exclude-functions:
      - (github.com/jackc/pgx/v5.Tx).Rollback

issues:
  exclude-rules:
    - path: _test\.go
      linters: [errcheck, bodyclose]
  max-issues-per-linter: 0
  max-same-issues: 0
