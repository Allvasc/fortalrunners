services:
  # 1. Backend API Service (Gratuito)
  - type: web
    name: fortalrunners-api
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: ./app
    envVars:
      - key: TARGET
        value: api
      - key: JWT_SECRET
        generateValue: true
      - key: MFA_ENC_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fortalrunners-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fortalrunners-redis
          property: connectionString

  # 2. Web Frontend Portal (Gratuito)
  - type: web
    name: fortalrunners-web
    env: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: fortalrunners-api
          property: host

  # 3. Redis Service (Gratuito)
  - type: redis
    name: fortalrunners-redis
    plan: free
    ipAllowList: []

databases:
  # 4. PostgreSQL Database (Gratuito)
  - name: fortalrunners-db
    databaseName: fortalrunners
    user: fortalrunners
    plan: free
    ipAllowList: []

