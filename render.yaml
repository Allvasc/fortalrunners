services:
  # 1. Backend API Service (Gratuito)
  - type: web
    name: fortalrunners-api
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    # sem dockerCommand: a imagem distroless não tem shell e o Render
    # embrulha dockerCommand em `sh -c`. O ENTRYPOINT ["/app"] (exec form)
    # do Dockerfile sobe o binário direto, sem shell.
    envVars:
      - key: APP_ENV
        value: prod
      - key: TARGET
        value: api
      - key: JWT_SECRET
        value: fortalrunners_prod_jwt_super_secret_key_32bytes_min
      - key: MFA_ENC_KEY
        value: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      - key: DATABASE_URL
        fromDatabase:
          name: fortalrunners-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fortalrunners-redis
          property: connectionString
      # origem do portal web para o CORS (o front roda em outro domínio)
      - key: CORS_ORIGINS
        value: https://fortalrunners-web.onrender.com

  # 2. Web Frontend Portal (Gratuito)
  - type: web
    name: fortalrunners-web
    env: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # URL completa (com https://) — property:host devolveria só o hostname
      - key: VITE_API_URL
        value: https://fortalrunners-api.onrender.com

  # 3. Redis Service (Gratuito)
  - type: redis
    name: fortalrunners-redis
    plan: free
    ipAllowList: []

databases:
  # 4. PostgreSQL Database (Gratuito)
  - name: fortalrunners-db
    databaseName: fortalrunners
    user: fortalrunners
    plan: free
    ipAllowList: []

