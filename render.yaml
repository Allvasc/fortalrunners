services:
  # 1. Backend API Service (Gratuito)
  - type: web
    name: fortalrunners-api
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    # sem dockerCommand: o ENTRYPOINT ["/app"] (exec form) sobe o binário
    # direto. A imagem é alpine (o binário linka musl via cgo do H3).
    envVars:
      - key: APP_ENV
        value: prod
      - key: TARGET
        value: api
      - key: JWT_SECRET
        value: fortalrunners_prod_jwt_super_secret_key_32bytes_min
      - key: MFA_ENC_KEY
        value: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      - key: DATABASE_URL
        fromDatabase:
          name: fortalrunners-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fortalrunners-redis
          property: connectionString
      # origem do portal web para o CORS (o front roda em outro domínio)
      - key: CORS_ORIGINS
        value: https://fortalrunners-web.onrender.com
      # --- segredos: valor definido no dashboard (Environment), não no blueprint ---
      - key: WEATHER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URL
        sync: false
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_REDIRECT_URL
        sync: false
      - key: STRAVA_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_P8_KEY
        sync: false
      - key: APPLE_REDIRECT_URL
        sync: false
      # base de um servidor OSRM p/ map-matching do traçado — vazio = desligado
      - key: OSRM_URL
        sync: false
      # e-mail transacional (Resend) — vazio = só registra o link no log
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  # 2. Web Frontend Portal (Gratuito)
  - type: web
    name: fortalrunners-web
    env: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # URL completa (com https://) — property:host devolveria só o hostname
      - key: VITE_API_URL
        value: https://fortalrunners-api.onrender.com

  # 3. Redis Service (Gratuito)
  - type: redis
    name: fortalrunners-redis
    plan: free
    ipAllowList: []

databases:
  # 4. PostgreSQL Database (Gratuito)
  - name: fortalrunners-db
    databaseName: fortalrunners
    user: fortalrunners
    plan: free
    ipAllowList: []

