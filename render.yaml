services:
  # 1. Backend API Service
  - type: web
    name: fortalrunners-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: ./app
    envVars:
      - key: TARGET
        value: api
      - key: JWT_SECRET
        generateValue: true
      - key: MFA_ENC_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fortalrunners-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fortalrunners-redis
          property: connectionString

  # 2. Background Territory Worker Service
  - type: worker
    name: fortalrunners-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: ./app
    envVars:
      - key: TARGET
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: fortalrunners-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fortalrunners-redis
          property: connectionString

  # 3. Web Frontend Portal
  - type: web
    name: fortalrunners-web
    env: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: fortalrunners-api
          property: url

  # 4. Redis Service
  - type: redis
    name: fortalrunners-redis
    ipAllowList: []

databases:
  # 5. PostgreSQL Database
  - name: fortalrunners-db
    databaseName: fortalrunners
    user: fortalrunners
    ipAllowList: []
