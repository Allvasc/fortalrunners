name: fortalrunners

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fortalrunners
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: fortalrunners
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortalrunners -d fortalrunners"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        TARGET: api
    environment:
      DATABASE_URL: postgres://fortalrunners:dev@postgres:5432/fortalrunners?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      JWT_SECRET: dev_super_secret_jwt_key_32_bytes_long!!
      MFA_ENC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CORS_ORIGINS: "http://localhost:5173,http://localhost:80,http://localhost"
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        TARGET: worker
    environment:
      DATABASE_URL: postgres://fortalrunners:dev@postgres:5432/fortalrunners?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
