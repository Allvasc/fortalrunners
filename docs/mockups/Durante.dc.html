    .grid3 .v { font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
    .grid3 .k { font-size: 10px; color: #7A817E; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; }
    .actions { display: flex; gap: 10px; margin-top: 15px; }
    .btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 14px; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 15px; }
    .btn.stop { background: #E0562F; color: #fff; }
    .btn.pause { background: #fff; color: #20302E; border: 1.5px solid #E1DBCB; }
