<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
    a { color: #0E7C86; text-decoration: none; } a:hover { color: #0A5A61; }
    .screen { position: relative; width: 390px; height: 844px; overflow: hidden; background: #EDE8DA; color: #20302E; }
    .map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .hdr { position: absolute; top: 0; left: 0; right: 0; padding: 54px 18px 14px; background: linear-gradient(#FBFAF6, #FBFAF6 66%, rgba(251,250,246,0)); }
    .hdr-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .title { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -0.01em; margin: 0; }
    .seg { display: flex; background: #EDE8DC; border: 1px solid #E1DBCB; border-radius: 999px; padding: 3px; gap: 2px; }
    .seg span { font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 999px; color: #7C7663; }
    .seg span.on { background: #fff; color: #0E7C86; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
    .fab { position: absolute; top: 106px; right: 14px; width: 44px; height: 44px; border-radius: 13px; background: #fff; border: 1px solid #EDE7D9; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px -6px rgba(20,40,44,0.28); color: #3B4442; }
    .fab svg { width: 21px; height: 21px; }
    .legend { position: absolute; left: 14px; bottom: 300px; background: #fff; border: 1px solid #EEE9DB; border-radius: 12px; padding: 9px 11px; font-size: 10px; color: #5B6360; box-shadow: 0 6px 16px -6px rgba(20,40,44,0.22); }
    .legend .lr { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
    .legend .sw { width: 13px; height: 10px; border-radius: 2px; }
    .card { position: absolute; left: 14px; right: 14px; bottom: 102px; background: #fff; border-radius: 22px; padding: 16px 16px 15px; box-shadow: 0 16px 34px -10px rgba(20,40,44,0.30); }
    .eyebrow { font-family: 'Archivo', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.16em; color: #0A5A61; margin: 0 0 9px; }
    .statrow { display: flex; align-items: baseline; gap: 8px; }
    .big { font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: -0.025em; color: #0E7C86; }
    .statrow span { font-size: 13px; color: #6B726F; font-weight: 600; }
    .bar { height: 8px; border-radius: 999px; background: #ECE7D9; overflow: hidden; margin: 12px 0 10px; }
    .bar > i { display: block; height: 100%; width: 3.1%; background: #0E7C86; border-radius: 999px; }
    .brk { display: flex; gap: 14px; font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: #4A524F; }
    .brk b { color: #20302E; }
    .goal { margin-top: 12px; font-size: 12px; color: #5B6360; display: flex; align-items: center; gap: 7px; }
    .goal svg { width: 15px; height: 15px; color: #C98F2E; flex: none; }
    .nav { position: absolute; left: 0; right: 0; bottom: 0; height: 88px; background: #fff; border-top: 1px solid #ECE7DA; display: flex; padding: 11px 6px 0; }
    .nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; color: #9AA0A0; }
    .nav a.on { color: #0E7C86; }
    .nav svg { width: 23px; height: 23px; }
  </style>
</helmet>

<div class="screen">
  <svg class="map" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9FCFCD"/><stop offset="1" stop-color="#BFDDDB"/>
      </linearGradient>
    </defs>

    <rect x="0" y="0" width="390" height="844" fill="#EDE8DA"/>

    <!-- neighborhood mesh -->
    <g stroke="#EFEBDD" stroke-width="2.5" stroke-linejoin="round">
      <path d="M14,168 L120,160 L138,248 L34,266 Z" fill="#E3DCC9"/>
      <path d="M120,160 L212,146 L224,224 L138,248 Z" fill="#E3DCC9"/>
      <path d="M212,146 L302,124 L322,206 L232,228 L224,224 Z" fill="#0E7C86" fill-opacity="0.11"/>
      <path d="M302,124 L382,100 L392,196 L332,208 L322,206 Z" fill="#E3DCC9"/>
      <path d="M34,266 L138,248 L156,362 L62,392 Z" fill="#E3DCC9"/>
      <path d="M138,248 L224,228 L248,344 L156,362 Z" fill="#0E7C86" fill-opacity="0.28"/>
      <path d="M224,228 L332,208 L360,340 L262,360 L248,344 Z" fill="#0E7C86" fill-opacity="0.07"/>
      <path d="M62,392 L156,362 L180,478 L74,504 Z" fill="#E3DCC9"/>
      <path d="M156,362 L262,360 L286,478 L180,478 Z" fill="#E3DCC9"/>
      <path d="M262,360 L360,340 L384,478 L286,478 Z" fill="#E3DCC9"/>
      <path d="M74,504 L286,478 L304,612 L88,632 Z" fill="#E3DCC9"/>
      <path d="M286,478 L384,478 L392,612 L304,612 Z" fill="#E3DCC9"/>
      <path d="M88,632 L304,612 L322,704 L118,716 Z" fill="#E3DCC9"/>
    </g>

    <!-- Cocó green -->
    <path d="M280,240 C312,224 348,236 352,282 C356,332 322,372 288,362 C262,354 268,300 270,272 C271,252 272,250 280,240 Z" fill="#C9D7BB"/>

    <!-- your actual territory inside Aldeota -->
    <g fill="#0E7C86" fill-opacity="0.55" stroke="#0A5A61" stroke-width="1.5" stroke-linejoin="round">
      <path d="M168,286 L206,282 L214,320 L176,326 Z"/>
      <path d="M150,310 L168,308 L172,338 L152,340 Z"/>
      <path d="M206,300 L224,298 L226,326 L208,330 Z"/>
    </g>
    <circle cx="188" cy="312" r="5" fill="#0E7C86" stroke="#fff" stroke-width="2"/>

    <!-- sea -->
    <path d="M0,0 H390 V44 C320,52 300,104 214,120 C150,132 90,110 40,132 C20,140 0,150 0,150 Z" fill="url(#sea)"/>

    <g font-family="Archivo, system-ui, sans-serif" fill="#877D66" letter-spacing="1.5">
      <text x="46" y="216" font-size="9">CENTRO</text>
      <text x="240" y="186" font-size="9">MEIRELES</text>
      <text x="160" y="312" font-size="9.5" font-weight="700" fill="#0A5A61">ALDEOTA</text>
      <text x="292" y="292" font-size="9">COCÓ</text>
      <text x="96" y="330" font-size="9">D. TORRES</text>
      <text x="180" y="430" font-size="9">FÁTIMA</text>
      <text x="300" y="430" font-size="9">P. AMARO</text>
      <text x="170" y="570" font-size="9">MESSEJANA</text>
      <text x="300" y="560" font-size="9">CIDADE 2000</text>
    </g>
  </svg>

  <div class="hdr">
    <div class="hdr-row">
      <p class="title">Fortaleza</p>
      <div class="seg"><span>Eu</span><span>Amigos</span><span class="on">Cidade</span></div>
    </div>
  </div>

  <div class="fab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5Z"/><path d="M3 13l9 5 9-5"/></svg>
  </div>

  <div class="legend">
    <div class="lr"><span class="sw" style="background:#E3DCC9"></span>Não dominado</div>
    <div class="lr"><span class="sw" style="background:rgba(14,124,134,0.16)"></span>Início de cobertura</div>
    <div class="lr"><span class="sw" style="background:rgba(14,124,134,0.4)"></span>Bem coberto por você</div>
  </div>

  <div class="card">
    <p class="eyebrow">COBERTURA DA CIDADE</p>
    <div class="statrow">
      <span class="big">3,1%</span>
      <span>de Fortaleza dominado</span>
    </div>
    <div class="bar"><i></i></div>
    <div class="brk">
      <span><b>Aldeota</b> 12%</span><span><b>Meireles</b> 4%</span><span><b>Cocó</b> 1%</span>
    </div>
    <div class="goal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
      Meta: 100% — pinte o mapa inteiro.
    </div>
  </div>

  <div class="nav">
    <a class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.2-6-10a6 6 0 1 1 12 0c0 4.8-6 10-6 10Z"/><circle cx="12" cy="11" r="2.2"/></svg>Mapa</a>
    <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v3a5 5 0 0 1-10 0V4Z"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M9 20h6M12 15v5"/></svg>Ranking</a>
    <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="3"/></svg>Missões</a>
    <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="3.2"/><path d="M5.5 19a6.5 6.5 0 0 1 13 0"/></svg>Perfil</a>
  </div>
</div>
</x-dc>
</body>
</html>
