<!doctype html>
<html>
<head>

<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
    a { color: #0E7C86; text-decoration: none; } a:hover { color: #0A5A61; }
    .screen { position: relative; width: 390px; height: 844px; overflow: hidden; background: #2E3524; color: #20302E; }
    .map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .hdr { position: absolute; top: 0; left: 0; right: 0; padding: 54px 18px 14px; background: linear-gradient(#FBFAF6, #FBFAF6 66%, rgba(251,250,246,0)); }
    .hdr-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .title { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -0.01em; margin: 0; }
    .seg { display: flex; background: #EDE8DC; border: 1px solid #E1DBCB; border-radius: 999px; padding: 3px; gap: 2px; }
    .seg span { font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 999px; color: #7C7663; }
    .seg span.on { background: #fff; color: #0E7C86; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
    .fab { position: absolute; top: 106px; right: 14px; width: 44px; height: 44px; border-radius: 13px; background: #fff; border: 1px solid #EDE7D9; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px -6px rgba(0,0,0,0.4); color: #3B4442; }
    .fab svg { width: 21px; height: 21px; }
    .stylechip { position: absolute; left: 14px; bottom: 260px; display: flex; align-items: center; gap: 7px; background: rgba(18,24,16,0.72); color: #EAE7D4; border-radius: 999px; padding: 6px 12px; font-size: 11px; font-weight: 700; font-family: 'Archivo', sans-serif; letter-spacing: 0.04em; backdrop-filter: blur(4px); }
    .stylechip svg { width: 13px; height: 13px; }
    .card { position: absolute; left: 14px; right: 14px; bottom: 102px; background: #fff; border-radius: 22px; padding: 16px 16px 15px; box-shadow: 0 16px 34px -10px rgba(0,0,0,0.45); }
    .eyebrow { font-family: 'Archivo', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.16em; color: #0A5A61; margin: 0 0 9px; }
    .statrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; }
    .big { font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: -0.025em; }
    .big small { font-size: 15px; font-weight: 600; color: #6B726F; margin-left: 3px; }
    .mstack { text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.5; color: #4A524F; }
    .mstack b { color: #20302E; }
    .bairro { display: flex; align-items: center; gap: 10px; margin-top: 13px; font-size: 12px; }
    .bairro .nm { font-weight: 600; }
    .bar { flex: 1; height: 7px; border-radius: 999px; background: #ECE7D9; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 12%; background: #0E7C86; border-radius: 999px; }
    .pct { font-family: 'IBM Plex Mono', monospace; font-weight: 500; color: #0A5A61; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 9px; height: 50px; border-radius: 14px; background: #E0562F; color: #fff; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 15px; margin-top: 14px; }
    .btn svg { width: 17px; height: 17px; }
    .nav { position: absolute; left: 0; right: 0; bottom: 0; height: 88px; background: #fff; border-top: 1px solid #ECE7DA; display: flex; padding: 11px 6px 0; }
    .nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; color: #9AA0A0; }
    .nav a.on { color: #0E7C86; }
    .nav svg { width: 23px; height: 23px; }
  </style>
</helmet>
