name: CI/CD Pipeline & Render Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: cd backend && go vet ./...

      - name: govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && govulncheck ./...

      - name: Run Backend Tests
        run: |
          cd backend
          go test -race -v ./...

      - name: Build with H3 tag (cgo, produção)
        run: |
          cd backend
          CGO_ENABLED=1 go build -tags h3 ./...
          CGO_ENABLED=1 go test -tags h3 ./internal/platform/h3grid/ ./internal/territory/...

  lint:
    name: Backend Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - name: golangci-lint
        run: |
          cd backend
          go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8 run --timeout=5m ./...

  web-tests:
    name: Web Frontend TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install & Check Web Types
        run: |
          cd web
          npm ci
          npx tsc --noEmit

  mobile-tests:
    name: Mobile App TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install & Check Mobile Types
        run: |
          cd mobile
          npm ci
          npx tsc --noEmit

  deploy:
    name: Deploy to Render
    needs: [backend-tests, web-tests, mobile-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook (API)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "RENDER_API_DEPLOY_HOOK secret is not set. Skipping webhook trigger."
          fi
